<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02070b">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>JARVIS // VOICE CORE</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#02070b;
    color:#dffcff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

.app{
    position:relative;
    width:100%;
    height:100%;
    max-width:700px;
    overflow:hidden;
    background:
        radial-gradient(circle at center,
        rgba(0,210,255,.10) 0%,
        rgba(0,70,100,.04) 28%,
        transparent 62%),
        #02070b;
}

/* Hintergrund */

.grid{
    position:absolute;
    inset:-50%;
    opacity:.16;
    background-image:
        linear-gradient(rgba(0,220,255,.16) 1px,transparent 1px),
        linear-gradient(90deg,rgba(0,220,255,.16) 1px,transparent 1px);
    background-size:42px 42px;
    transform:perspective(500px) rotateX(62deg);
    transform-origin:center bottom;
}

/* Kopf */

.header{
    position:absolute;
    top:0;
    left:0;
    right:0;
    padding:
        calc(env(safe-area-inset-top) + 18px)
        22px 10px;
    text-align:center;
    z-index:10;
}

.logo{
    font-size:12px;
    letter-spacing:5px;
    color:#65eaff;
    opacity:.9;
}

.title{
    margin-top:5px;
    font-size:24px;
    font-weight:300;
    letter-spacing:7px;
}

.status{
    margin-top:9px;
    font-size:11px;
    letter-spacing:3px;
    color:#62e9ff;
    opacity:.8;
}

/* Kern */

.core-area{
    position:absolute;
    top:50%;
    left:50%;
    width:300px;
    height:300px;
    transform:translate(-50%,-50%);
}

.core{
    position:absolute;
    left:50%;
    top:50%;
    width:86px;
    height:86px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:
        radial-gradient(circle,
        #dffcff 0%,
        #65eaff 13%,
        #008bb0 35%,
        rgba(0,130,170,.2) 65%,
        transparent 72%);
    box-shadow:
        0 0 20px #00d9ff,
        0 0 50px rgba(0,217,255,.65),
        0 0 100px rgba(0,130,255,.25);
    animation:corePulse 2.2s infinite ease-in-out;
}

.ring{
    position:absolute;
    left:50%;
    top:50%;
    border:1px solid rgba(77,228,255,.55);
    border-radius:50%;
    transform:translate(-50%,-50%);
}

.r1{
    width:130px;
    height:130px;
    animation:spin 9s linear infinite;
    border-left-color:transparent;
    border-right-color:#54eaff;
}

.r2{
    width:190px;
    height:190px;
    animation:spinReverse 14s linear infinite;
    border-top-color:transparent;
    border-bottom-color:#54eaff;
}

.r3{
    width:250px;
    height:250px;
    animation:spin 22s linear infinite;
    border-left-color:rgba(84,234,255,.2);
    border-right-color:rgba(84,234,255,.8);
}

.r4{
    width:290px;
    height:290px;
    border-color:rgba(84,234,255,.12);
}

@keyframes spin{
    from{transform:translate(-50%,-50%) rotate(0deg)}
    to{transform:translate(-50%,-50%) rotate(360deg)}
}

@keyframes spinReverse{
    from{transform:translate(-50%,-50%) rotate(360deg)}
    to{transform:translate(-50%,-50%) rotate(0deg)}
}

@keyframes corePulse{
    0%,100%{
        transform:translate(-50%,-50%) scale(.92);
        opacity:.8;
    }
    50%{
        transform:translate(-50%,-50%) scale(1.08);
        opacity:1;
    }
}

/* Listening */

body.listening .core{
    animation:listenPulse .65s infinite alternate;
    box-shadow:
        0 0 25px #00eaff,
        0 0 70px rgba(0,234,255,.8),
        0 0 130px rgba(0,140,255,.35);
}

@keyframes listenPulse{
    from{
        transform:translate(-50%,-50%) scale(.9);
    }
    to{
        transform:translate(-50%,-50%) scale(1.15);
    }
}

/* Denken */

body.thinking .core{
    animation:thinkPulse .8s infinite alternate;
}

@keyframes thinkPulse{
    from{
        transform:translate(-50%,-50%) scale(.85);
        filter:brightness(.8);
    }
    to{
        transform:translate(-50%,-50%) scale(1.18);
        filter:brightness(1.5);
    }
}

/* Untere Anzeige */

.panel{
    position:absolute;
    left:18px;
    right:18px;
    bottom:
        calc(env(safe-area-inset-bottom) + 18px);
    z-index:20;
}

.transcript{
    min-height:54px;
    margin-bottom:13px;
    padding:12px 15px;
    border:1px solid rgba(80,220,255,.25);
    border-radius:15px;
    background:rgba(2,12,18,.72);
    backdrop-filter:blur(14px);
    box-shadow:0 0 25px rgba(0,180,255,.08);
    font-size:14px;
    line-height:1.4;
    color:#dffcff;
}

.transcript .label{
    display:block;
    margin-bottom:4px;
    font-size:9px;
    letter-spacing:2px;
    color:#54eaff;
    opacity:.7;
}

.controls{
    display:flex;
    gap:10px;
}

button{
    flex:1;
    min-height:52px;
    border:1px solid rgba(83,231,255,.5);
    border-radius:16px;
    background:
        linear-gradient(
        180deg,
        rgba(8,45,58,.9),
        rgba(3,18,25,.95));
    color:#dffcff;
    font-size:12px;
    letter-spacing:2px;
    font-weight:600;
    box-shadow:
        inset 0 0 18px rgba(0,200,255,.06),
        0 0 15px rgba(0,190,255,.08);
}

button:active{
    transform:scale(.97);
}

#talkButton{
    flex:1.7;
    background:
        linear-gradient(
        180deg,
        rgba(0,112,145,.65),
        rgba(2,36,48,.95));
}

#talkButton.active{
    border-color:#7df5ff;
    box-shadow:
        0 0 20px rgba(0,230,255,.35),
        inset 0 0 20px rgba(0,230,255,.15);
}

.footer{
    margin-top:9px;
    text-align:center;
    font-size:9px;
    letter-spacing:2px;
    color:#4aa7b8;
    opacity:.65;
}

/* Fehler */

.error{
    position:absolute;
    top:115px;
    left:20px;
    right:20px;
    padding:10px 12px;
    border:1px solid rgba(255,80,80,.4);
    border-radius:12px;
    background:rgba(60,5,5,.8);
    color:#ffb5b5;
    font-size:11px;
    line-height:1.4;
    display:none;
    z-index:50;
}

.error.show{
    display:block;
}
</style>
</head>

<body>

<div class="app">

    <div class="grid"></div>

    <div class="header">
        <div class="logo">STARK INDUSTRIES</div>
        <div class="title">JARVIS</div>
        <div id="status" class="status">SYSTEM BEREIT</div>
    </div>

    <div id="errorBox" class="error"></div>

    <div class="core-area">
        <div class="ring r4"></div>
        <div class="ring r3"></div>
        <div class="ring r2"></div>
        <div class="ring r1"></div>
        <div class="core"></div>
    </div>

    <div class="panel">

        <div class="transcript">
            <span class="label">JARVIS CORE</span>
            <span id="output">
                Bereit. Drücke „SPRECHEN“ und sprich mit mir.
            </span>
        </div>

        <div class="controls">
            <button id="talkButton">SPRECHEN</button>
            <button id="stopButton">STOP</button>
        </div>

        <div class="footer">
            VOICE CORE • AI ONLINE • SECURE LINK
        </div>

    </div>

</div>

<script>

/* =========================================================
   JARVIS CONFIG
   ========================================================= */

/*
   HIER deinen API-Key einsetzen.

   NICHT:
   "DEIN_API_KEY_HIER"

   SONDERN deinen echten Key.

   ACHTUNG:
   Wenn diese Datei öffentlich auf GitHub liegt,
   kann der Key von anderen gesehen werden.
*/

const OPENAI_API_KEY = "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";


/*
   Aktuelles Modell.
*/
const OPENAI_MODEL = "gpt-6-luna";

const OPENAI_URL =
    "https://api.openai.com/v1/responses";


/* =========================================================
   JARVIS PERSONA
   ========================================================= */

const JARVIS_INSTRUCTIONS = `
Du bist JARVIS, ein intelligenter persönlicher KI-Assistent.

Antworte auf Deutsch, außer der Benutzer bittet ausdrücklich
um eine andere Sprache.

Dein Stil:
- ruhig
- intelligent
- präzise
- höflich
- technisch kompetent
- leicht futuristisch
- keine unnötig langen Antworten

Du bist ein persönlicher Sprachassistent.
Wenn der Benutzer dich direkt anspricht, antworte natürlich.

Wenn eine Frage einfach ist, antworte kurz.
Wenn eine Aufgabe komplex ist, erkläre sie verständlich.

Nenne dich selbst JARVIS.

WICHTIG:
Die Antworten werden vorgelesen.
Vermeide deshalb unnötige Sonderzeichen,
lange Listen und komplizierte Formatierungen.
`;


/* =========================================================
   ELEMENTE
   ========================================================= */

const output = document.getElementById("output");
const statusText = document.getElementById("status");
const talkButton = document.getElementById("talkButton");
const stopButton = document.getElementById("stopButton");
const errorBox = document.getElementById("errorBox");


/* =========================================================
   ZUSTAND
   ========================================================= */

let recognition = null;

let listening = false;
let thinking = false;
let speaking = false;

let restartRecognition = false;

let finalTranscript = "";

let conversation = [];

let selectedVoice = null;


/* =========================================================
   SPRACHAUSGABE
   ========================================================= */

function loadVoices(){

    const voices = speechSynthesis.getVoices();

    if(!voices.length) return;

    selectedVoice =
        voices.find(v =>
            v.lang &&
            v.lang.toLowerCase().startsWith("de")
        ) || voices[0];
}

speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();


function speak(text){

    if(!text) return;

    speechSynthesis.cancel();

    speaking = true;

    document.body.classList.remove("listening");
    document.body.classList.remove("thinking");

    statusText.textContent = "JARVIS SPRICHT";
    output.textContent = text;

    const utterance =
        new SpeechSynthesisUtterance(text);

    utterance.lang = "de-DE";

    if(selectedVoice){
        utterance.voice = selectedVoice;
    }

    utterance.rate = 1.0;
    utterance.pitch = 0.9;
    utterance.volume = 1.0;

    utterance.onend = () => {

        speaking = false;

        statusText.textContent =
            "SYSTEM BEREIT";

        if(restartRecognition){
            setTimeout(() => {
                startListening();
            }, 250);
        }
    };

    utterance.onerror = () => {

        speaking = false;

        statusText.textContent =
            "SYSTEM BEREIT";
    };

    speechSynthesis.speak(utterance);
}


/* =========================================================
   SPRACHE ERKENNUNG
   ========================================================= */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if(!SpeechRecognition){

    showError(
        "Dieser Browser unterstützt keine Spracherkennung. " +
        "Bitte Safari auf dem iPhone verwenden."
    );

}else{

    recognition = new SpeechRecognition();

    recognition.lang = "de-DE";

    /*
       Wichtig für iPhone:
       Wir verwenden continuous, aber starten bei Bedarf
       automatisch neu.
    */
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.maxAlternatives = 1;


    recognition.onstart = () => {

        listening = true;
        thinking = false;

        document.body.classList.add("listening");
        document.body.classList.remove("thinking");

        talkButton.classList.add("active");

        statusText.textContent =
            "ICH HÖRE ZU";

        output.textContent =
            "Ich höre zu...";
    };


    recognition.onresult = async (event) => {

        let interim = "";
        let finalText = "";

        for(
            let i = event.resultIndex;
            i < event.results.length;
            i++
        ){

            const result = event.results[i];

            if(result.isFinal){

                finalText +=
                    result[0].transcript;

            }else{

                interim +=
                    result[0].transcript;
            }
        }


        if(interim){

            output.textContent =
                interim;

            statusText.textContent =
                "ICH HÖRE ZU";
        }


        if(finalText){

            finalTranscript +=
                " " + finalText;

            finalTranscript =
                finalTranscript.trim();

            output.textContent =
                finalTranscript;

            /*
               Kurze Pause geben, damit Safari
               den Satz sauber abschließen kann.
            */

            clearTimeout(window.jarvisSpeechTimer);

            window.jarvisSpeechTimer =
                setTimeout(() => {

                    const message =
                        finalTranscript.trim();

                    finalTranscript = "";

                    if(message){
                        processUserMessage(message);
                    }

                }, 450);
        }
    };


    recognition.onerror = (event) => {

        console.log(
            "SpeechRecognition:",
            event.error
        );

        listening = false;

        document.body.classList.remove("listening");

        talkButton.classList.remove("active");

        /*
           Bei normalen iPhone-Safari-Unterbrechungen
           nicht sofort einen Fehler anzeigen.
        */

        if(
            event.error === "not-allowed" ||
            event.error === "service-not-allowed"
        ){

            showError(
                "Mikrofonzugriff wurde blockiert. " +
                "Bitte Safari den Mikrofonzugriff erlauben."
            );

            statusText.textContent =
                "MIKROFON NICHT ERLAUBT";

        }
    };


    recognition.onend = () => {

        listening = false;

        document.body.classList.remove("listening");

        talkButton.classList.remove("active");


        /*
           Wenn JARVIS nicht spricht und nicht denkt,
           darf Safari die Erkennung neu starten.
        */

        if(
            restartRecognition &&
            !speaking &&
            !thinking
        ){

            setTimeout(() => {

                if(
                    restartRecognition &&
                    !speaking &&
                    !thinking
                ){
                    startListening();
                }

            }, 350);
        }
    };
}


/* =========================================================
   MIKROFON START
   ========================================================= */

function startListening(){

    if(!recognition) return;

    if(speaking){

        speechSynthesis.cancel();
        speaking = false;
    }

    try{

        finalTranscript = "";

        recognition.start();

    }catch(error){

        /*
           Safari kann "already started" melden.
           Das ignorieren wir.
        */

        console.log(error);
    }
}


/* =========================================================
   MIKROFON STOP
   ========================================================= */

function stopListening(){

    restartRecognition = false;

    listening = false;

    if(recognition){

        try{
            recognition.stop();
        }catch(e){}
    }

    speechSynthesis.cancel();

    speaking = false;
    thinking = false;

    document.body.classList.remove("listening");
    document.body.classList.remove("thinking");

    talkButton.classList.remove("active");

    statusText.textContent =
        "SYSTEM BEREIT";

    output.textContent =
        "Bereit.";
}


/* =========================================================
   BUTTON
   ========================================================= */

talkButton.addEventListener("click", () => {

    /*
       iPhone Safari braucht die Mikrofonaktion
       direkt aus einem Benutzer-Tap.
    */

    restartRecognition = true;

    if(speaking){

        speechSynthesis.cancel();
        speaking = false;
    }

    startListening();
});


stopButton.addEventListener("click", () => {

    stopListening();

});


/* =========================================================
   USER MESSAGE
   ========================================================= */

async function processUserMessage(message){

    if(!message) return;

    /*
       Mikrofon während KI-Antwort stoppen.
       Dadurch hört JARVIS seine eigene Stimme
       nicht als neue Frage.
    */

    if(recognition){

        try{
            recognition.stop();
        }catch(e){}
    }

    listening = false;

    document.body.classList.remove("listening");
    talkButton.classList.remove("active");


    /*
       Denken
    */

    thinking = true;

    document.body.classList.add("thinking");

    statusText.textContent =
        "JARVIS DENKT...";

    output.textContent =
        "Verarbeite Anfrage...";


    /*
       Gespräch speichern
    */

    conversation.push({
        role:"user",
        content:message
    });


    try{

        const answer =
            await askOpenAI();


        conversation.push({
            role:"assistant",
            content:answer
        });


        thinking = false;

        document.body.classList.remove("thinking");


        /*
           Antwort vorlesen
        */

        restartRecognition = true;

        speak(answer);


    }catch(error){

        console.error(error);

        thinking = false;

        document.body.classList.remove("thinking");

        statusText.textContent =
            "VERBINDUNGSFEHLER";

        const message =
            getReadableError(error);

        output.textContent =
            message;

        restartRecognition = true;

        setTimeout(() => {

            speak(message);

        },200);
    }
}


/* =========================================================
   OPENAI
   ========================================================= */

async function askOpenAI(){

    if(
        !OPENAI_API_KEY ||
        OPENAI_API_KEY === "DEIN_API_KEY_HIER"
    ){

        throw new Error(
            "API_KEY_MISSING"
        );
    }


    /*
       Gespräch für das Modell vorbereiten.
       Nur die letzten Nachrichten senden,
       damit die Anfrage nicht unnötig groß wird.
    */

    const recentConversation =
        conversation.slice(-20);


    const input =
        recentConversation.map(item => {

            return {
                role:item.role,
                content:[
                    {
                        type:"input_text",
                        text:item.content
                    }
                ]
            };

        });


    const response =
        await fetch(
            OPENAI_URL,
            {
                method:"POST",

                headers:{
                    "Content-Type":
                        "application/json",

                    "Authorization":
                        "Bearer " +
                        OPENAI_API_KEY
                },

                body:JSON.stringify({

                    model:OPENAI_MODEL,

                    instructions:
                        JARVIS_INSTRUCTIONS,

                    input:input,

                    max_output_tokens:500
                })
            }
        );


    /*
       Fehler vom Server auslesen
    */

    if(!response.ok){

        let data = null;

        try{
            data = await response.json();
        }catch(e){}

        console.error(
            "OpenAI API Fehler:",
            data
        );

        const error =
            new Error(
                data?.error?.message ||
                `HTTP `
            );

        error.status =
            response.status;

        error.apiData =
            data;

        throw error;
    }


    const data =
        await response.json();


    /*
       Responses API:
       output_text kann direkt vorhanden sein.
    */

    if(
        data.output_text &&
        typeof data.output_text === "string"
    ){

        return data.output_text.trim();
    }


    /*
       Fallback, falls output_text nicht direkt
       vorhanden ist.
    */

    let text = "";

    if(Array.isArray(data.output)){

        for(const item of data.output){

            if(
                item.type === "message" &&
                Array.isArray(item.content)
            ){

                for(const content of item.content){

                    if(
                        content.type === "output_text" &&
                        content.text
                    ){

                        text +=
                            content.text;
                    }
                }
            }
        }
    }


    if(text.trim()){

        return text.trim();
    }


    throw new Error(
        "Die KI hat keine Textantwort geliefert."
    );
}


/* =========================================================
   FEHLER
   ========================================================= */

function showError(message){

    errorBox.textContent =
        message;

    errorBox.classList.add("show");

    setTimeout(() => {

        errorBox.classList.remove("show");

    },7000);
}


function getReadableError(error){

    if(
        error.message ===
        "API_KEY_MISSING"
    ){

        return "Mein KI-Schlüssel ist noch nicht eingetragen.";
    }


    if(error.status === 401){

        return "Der KI-Schlüssel wurde abgelehnt. Bitte überprüfe den API-Key.";
    }


    if(error.status === 403){

        return "Der Zugriff auf die KI-API wurde verweigert.";
    }


    if(error.status === 429){

        return "Die KI-Anfrage wurde momentan begrenzt. Bitte versuche es gleich erneut.";
    }


    if(
        error.message &&
        error.message.toLowerCase().includes("failed to fetch")
    ){

        return "Die Verbindung zur KI konnte nicht hergestellt werden.";
    }


    return "Es ist ein Fehler bei der Verbindung mit meinem KI-Gehirn aufgetreten.";
}


/* =========================================================
   START
   ========================================================= */

statusText.textContent =
    "SYSTEM BEREIT";

output.textContent =
    "Bereit. Drücke SPRECHEN und sprich mit mir.";


/*
   Safari lädt Stimmen teilweise verzögert.
*/

setTimeout(loadVoices,500);
setTimeout(loadVoices,1500);


/*
   Kleine Begrüßung nur beim ersten Öffnen.
   Keine automatische Sprachausgabe, weil iPhone Safari
   Audio ohne Benutzeraktion blockieren kann.
*/

console.log("JARVIS VOICE CORE ONLINE");

</script>

</body>
</html>
