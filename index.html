<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02070b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>JARVIS</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 15%,#0b2934 0,#02070b 42%,#000 100%);color:#e5fbff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:720px;margin:auto;padding:24px 16px 40px}
h1{text-align:center;color:#00eaff;letter-spacing:.35em;margin:8px 0 3px;font-size:30px;text-shadow:0 0 18px #00eaff55}
.sub{text-align:center;color:#78a5af;font-size:11px;letter-spacing:.18em}
.core{width:190px;height:190px;margin:28px auto 18px;border:2px solid #00eaff;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 28px #00eaff55,inset 0 0 35px #00eaff22;position:relative}
.core:before,.core:after{content:"";position:absolute;border:1px solid #00eaff66;border-radius:50%}
.core:before{inset:18px}.core:after{inset:42px}
.core span{font-size:38px;color:#00eaff;z-index:2}
.active{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 60px #00eaffaa,inset 0 0 45px #00eaff44}}
.status{text-align:center;color:#00eaff;font-weight:700;letter-spacing:.13em;margin-bottom:16px}
.panel{background:#07131bdd;border:1px solid #0b4652;border-radius:18px;padding:15px;margin-top:14px}
video{width:100%;max-height:360px;border-radius:13px;background:#000;display:none;object-fit:cover}
button{width:100%;border:1px solid #0b6878;background:#06232c;color:#e5fbff;border-radius:13px;padding:14px;margin-top:10px;font-size:16px}
button:active{transform:scale(.98)}
.transcript{min-height:80px;white-space:pre-wrap;line-height:1.5;color:#ccecf1}
.hint{margin-top:12px;color:#789da6;font-size:12px;line-height:1.5}
</style>
</head>
<body>
<main>
<h1>JARVIS</h1>
<div class="sub">PERSONAL VOICE ASSISTANT</div>

<div id="core" class="core"><span>J</span></div>
<div id="status" class="status">BEREIT</div>

<div class="panel">
  <video id="camera" autoplay playsinline muted></video>
  <button id="start">🎙️ JARVIS AKTIVIEREN</button>
  <button id="test">🔊 Stimme testen</button>
  <button id="camOff">📷 Kamera ausschalten</button>
</div>

<div class="panel">
  <div id="text" class="transcript">Sag nach der Aktivierung: „Jarvis …“</div>
  <div class="hint">
    JARVIS hört nach der Aktivierung auf das Wort „Jarvis“.
    Beispiele: „Jarvis, schalte die Kamera ein.“ · „Jarvis, schalte die Kamera aus.“ · „Jarvis, hallo.“
  </div>
</div>
</main>

<script>
const statusEl=document.getElementById("status");
const textEl=document.getElementById("text");
const core=document.getElementById("core");
const startBtn=document.getElementById("start");
const testBtn=document.getElementById("test");
const camOffBtn=document.getElementById("camOff");
const video=document.getElementById("camera");

let recognition=null;
let stream=null;
let running=false;
let restarting=false;

function setStatus(s){statusEl.textContent=s}
function say(t){
  if(!("speechSynthesis" in window)){return}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);
  u.lang="de-DE"; u.rate=.95; u.pitch=1;
  u.onstart=()=>setStatus("JARVIS SPRICHT");
  u.onend=()=>{if(running)setStatus("ICH HÖRE")}
  speechSynthesis.speak(u);
}

async function cameraOn(){
  if(stream)return;
  try{
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:"environment"}},
      audio:false
    });
    video.srcObject=stream;
    video.style.display="block";
    setStatus("KAMERA AKTIV");
    say("Die Kamera ist jetzt aktiv.");
  }catch(e){
    setStatus("KAMERA ERLAUBNIS FEHLT");
    textEl.textContent="Bitte erlaube JARVIS den Kamerazugriff.";
    say("Ich brauche deine Erlaubnis für die Kamera.");
  }
}

function cameraOff(){
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  video.srcObject=null;
  video.style.display="none";
  if(running)setStatus("ICH HÖRE"); else setStatus("BEREIT");
}

function command(raw){
  const original=raw.trim();
  const t=original.toLowerCase();
  if(!/\bjarvis\b/.test(t))return;

  core.classList.add("active");
  textEl.textContent=original;
  const c=t.replace(/\bhey\s+jarvis\b|\bjarvis\b/g,"").trim();

  if(/kamera.*(ein|an|start|aktiv)|(?:ein|an|start|aktiv).*kamera/.test(c)){
    cameraOn(); return;
  }
  if(/kamera.*(aus|stopp|stop|deaktiv)|(?:aus|stopp|stop|deaktiv).*kamera/.test(c)){
    cameraOff(); say("Die Kamera ist ausgeschaltet."); return;
  }
  if(/(hallo|hi|hey|bist du da|hörst du mich)/.test(c)){
    say("Ja. Ich bin da und höre dir zu."); return;
  }
  if(/(sprich|rede|stimme)/.test(c)){
    say("Natürlich. Ich bin JARVIS."); return;
  }
  say("Ich habe dich verstanden. Dieser Befehl wird in den nächsten Ausbaustufen erweitert.");
}

function begin(){
  const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SpeechRecognition){
    setStatus("SPRACHE NICHT VERFÜGBAR");
    textEl.textContent="Die Spracherkennung wird von dieser Safari-Version nicht unterstützt.";
    return;
  }
  if(running)return;

  recognition=new SpeechRecognition();
  recognition.lang="de-DE";
  recognition.continuous=true;
  recognition.interimResults=true;
  recognition.maxAlternatives=1;

  recognition.onstart=()=>{
    running=true; restarting=false;
    startBtn.textContent="🎙️ JARVIS HÖRT ZU";
    core.classList.add("active");
    setStatus("ICH HÖRE");
  };

  recognition.onresult=(e)=>{
    let interim="";
    for(let i=e.resultIndex;i<e.results.length;i++){
      const r=e.results[i];
      const s=r[0].transcript;
      if(r.isFinal)command(s);
      else interim+=s;
    }
    if(interim)textEl.textContent=interim;
  };

  recognition.onerror=(e)=>{
    if(e.error==="not-allowed"||e.error==="service-not-allowed"){
      running=false;
      core.classList.remove("active");
      setStatus("MIKROFON ERLAUBNIS FEHLT");
      textEl.textContent="Bitte erlaube Safari den Mikrofonzugriff.";
    }
  };

  recognition.onend=()=>{
    if(running && !restarting){
      restarting=true;
      setTimeout(()=>{
        restarting=false;
        try{recognition.start()}catch(e){}
      },300);
    }
  };

  try{recognition.start()}catch(e){}
}

startBtn.addEventListener("click",begin);
camOffBtn.addEventListener("click",cameraOff);
testBtn.addEventListener("click",()=>say("Hallo. Ich bin JARVIS. Ich kann jetzt mit dir sprechen."));

/* Wenn Safari die Spracherkennung bereits erlaubt, versuchen wir sie beim Laden zu starten. */
window.addEventListener("load",()=>{
  setTimeout(()=>{
    try{begin()}catch(e){}
  },700);
});
</script>
</body>
</html>
