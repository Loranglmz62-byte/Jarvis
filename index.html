<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JARVIS</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at center, #0b2635 0%, #02070b 45%, #000 100%);
    color: #00eaff;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.container {
    width: 100%;
    max-width: 600px;
    padding: 25px;
    text-align: center;
}

h1 {
    font-size: 42px;
    letter-spacing: 8px;
    margin-bottom: 5px;
    text-shadow: 0 0 20px #00eaff;
}

.status {
    font-size: 14px;
    letter-spacing: 3px;
    margin-bottom: 35px;
    color: #8eefff;
}

.core {
    width: 230px;
    height: 230px;
    margin: auto;
    border-radius: 50%;
    border: 2px solid #00eaff;
    box-shadow:
        0 0 20px #00eaff,
        inset 0 0 30px #00eaff;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    animation: pulse 3s infinite;
}

.core::before,
.core::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    border: 1px solid #00eaff;
}

.core::before {
    width: 175px;
    height: 175px;
}

.core::after {
    width: 125px;
    height: 125px;
}

.brain {
    font-size: 55px;
    z-index: 2;
    text-shadow: 0 0 25px #00eaff;
}

@keyframes pulse {
    0%,100% {
        transform: scale(1);
        box-shadow:
            0 0 20px #00eaff,
            inset 0 0 30px #00eaff;
    }

    50% {
        transform: scale(1.04);
        box-shadow:
            0 0 50px #00eaff,
            inset 0 0 45px #00eaff;
    }
}

button {
    margin-top: 35px;
    padding: 15px 30px;
    margin-left: 5px;
    margin-right: 5px;
    border-radius: 30px;
    border: 1px solid #00eaff;
    background: rgba(0, 234, 255, 0.08);
    color: #00eaff;
    font-size: 16px;
    letter-spacing: 2px;
    cursor: pointer;
    box-shadow: 0 0 15px rgba(0,234,255,.3);
}

button:active {
    transform: scale(.95);
}

#conversation {
    margin-top: 30px;
    text-align: left;
    max-height: 220px;
    overflow-y: auto;
    padding: 15px;
    border: 1px solid rgba(0,234,255,.2);
    border-radius: 15px;
    background: rgba(0,0,0,.25);
}

.message {
    margin: 10px 0;
    line-height: 1.5;
}

.user {
    color: #fff;
}

.jarvis {
    color: #00eaff;
}

.thinking {
    animation: thinking 1s infinite;
}

@keyframes thinking {
    50% {
        opacity: .3;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>JARVIS</h1>

    <div id="status" class="status">
        SYSTEM BEREIT
    </div>

    <div class="core">
        <div class="brain">◉</div>
    </div>

    <button onclick="startListening()">
        🎙 SPRECHEN
    </button>

    <button onclick="stopListening()">
        ■ STOP
    </button>

    <div id="conversation"></div>

</div>

<script>

/* =====================================================
   🔑 DEIN OPENAI API KEY
   ===================================================== */

const OPENAI_API_KEY = "DEIN_API_KEY_HIER";


/* =====================================================
   JARVIS EINSTELLUNGEN
   ===================================================== */

const statusText = document.getElementById("status");
const conversationBox = document.getElementById("conversation");

let recognition;
let listening = false;


/* =====================================================
   SPRACHERKENNUNG
   ===================================================== */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

if (SpeechRecognition) {

    recognition = new SpeechRecognition();

    recognition.lang = "de-DE";
    recognition.continuous = false;
    recognition.interimResults = false;

    recognition.onstart = function() {

        listening = true;

        statusText.textContent = "ICH HÖRE ZU...";
    };

    recognition.onresult = async function(event) {

        const text =
            event.results[event.results.length - 1][0].transcript;

        console.log("Du:", text);

        addMessage("DU", text, "user");

        await askJARVIS(text);
    };

    recognition.onerror = function(event) {

        console.error(event);

        statusText.textContent =
            "MIKROFON FEHLER";
    };

    recognition.onend = function() {

        listening = false;
    };

}


/* =====================================================
   MIKROFON STARTEN
   ===================================================== */

function startListening() {

    if (!recognition) {

        alert(
            "Dein Browser unterstützt leider keine Spracherkennung."
        );

        return;
    }

    if (!listening) {

        recognition.start();
    }
}


/* =====================================================
   MIKROFON STOPPEN
   ===================================================== */

function stopListening() {

    if (recognition && listening) {

        recognition.stop();
    }

    speechSynthesis.cancel();

    statusText.textContent =
        "SYSTEM BEREIT";
}


/* =====================================================
   JARVIS → OPENAI
   ===================================================== */

async function askJARVIS(userText) {

    statusText.textContent =
        "JARVIS DENKT...";

    statusText.classList.add("thinking");

    try {

        const response = await fetch(
            "https://api.openai.com/v1/responses",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    "Authorization":
                        "Bearer " + OPENAI_API_KEY
                },

                body: JSON.stringify({

                    model: "gpt-6-luna",

                    instructions:
                        "Du bist JARVIS, ein intelligenter persönlicher KI-Assistent. Antworte auf Deutsch. Sei freundlich, präzise und selbstbewusst. Sprich natürlich und nicht unnötig lang.",

                    input: userText,

                    max_output_tokens: 500
                })
            }
        );


        const data = await response.json();

        console.log("OpenAI:", data);


        if (!response.ok) {

            throw new Error(
                data?.error?.message ||
                "OpenAI API Fehler"
            );
        }


        const answer =
            data.output_text || "";


        if (!answer) {

            throw new Error(
                "JARVIS hat keine Antwort erhalten."
            );
        }


        console.log("JARVIS:", answer);

        addMessage(
            "JARVIS",
            answer,
            "jarvis"
        );


        statusText.classList.remove("thinking");

        statusText.textContent =
            "JARVIS ANTWORTET...";


        speak(answer);


    } catch (error) {

        console.error(error);

        statusText.classList.remove("thinking");

        statusText.textContent =
            "VERBINDUNGSFEHLER";

        addMessage(
            "SYSTEM",
            "Fehler: " + error.message,
            "jarvis"
        );
    }
}


/* =====================================================
   TEXT AUF BILDSCHIRM
   ===================================================== */

function addMessage(sender, text, className) {

    const message =
        document.createElement("div");

    message.className =
        "message " + className;

    message.innerHTML =
        "<strong>" +
        sender +
        ":</strong> " +
        escapeHTML(text);

    conversationBox.appendChild(message);

    conversationBox.scrollTop =
        conversationBox.scrollHeight;
}


/* =====================================================
   SICHERER TEXT
   ===================================================== */

function escapeHTML(text) {

    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =====================================================
   JARVIS SPRICHT
   ===================================================== */

function speak(text) {

    speechSynthesis.cancel();

    const speech =
        new SpeechSynthesisUtterance(text);

    speech.lang = "de-DE";

    speech.rate = 0.95;

    speech.pitch = 0.9;

    speech.volume = 1;


    const voices =
        speechSynthesis.getVoices();

    const germanVoice =
        voices.find(
            voice =>
                voice.lang &&
                voice.lang.toLowerCase()
                    .startsWith("de")
        );

    if (germanVoice) {

        speech.voice = germanVoice;
    }


    speech.onend = function() {

        statusText.textContent =
            "SYSTEM BEREIT";
    };


    speech.onerror = function() {

        statusText.textContent =
            "SPRACHAUSGABE FEHLER";
    };


    speechSynthesis.speak(speech);
}


/* =====================================================
   START
   ===================================================== */

speechSynthesis.getVoices();

statusText.textContent =
    "SYSTEM BEREIT";

</script>

</body>
</html>
